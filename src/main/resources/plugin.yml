main: com.snorklingturtle.photographer.Photographer
name: Photographer
version: 1.0.0
description: A Minecraft camera plugin that renders photos onto maps.
author: SkooterKurt
api-version: 1.21
softdepend: [Multiverse-Core]

commands:
  camera:
    description: Camera plugin commands.
    usage: /camera <help|fov|antialiasing|shading|shadows|dithering>
    permission: camera.command

permissions:
  camera.craft:
    description: Allows crafting the camera.
    default: true
  camera.use:
    description: Allows using the camera item.
    default: true
  camera.command:
    description: Allows changing visual settings of photos through the /camera command.
    default: true
  camera.admincommand:
    description: Allows changing overall settings, such as color definitions, through the /camera command.
    default: op
  camera.consumepaper:
    description: Consume paper when taking photos
    default: true
  camera.consumedye:
    description: Consume dye when coloring an item frame
    default: true
